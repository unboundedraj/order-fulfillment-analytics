version: 2

sources:
  - name: raw
    description: >
      Append-only copies of the order-management system's daily CDC extracts, loaded by
      `fulfillment.loader`. Every row carries `_source_file`, `_loaded_at` and `_load_id`.
    schema: raw
    loaded_at_field: _loaded_at
    freshness:
      warn_after: {count: 1, period: day}
      error_after: {count: 3, period: day}
    tables:
      - name: orders
        description: One row per order *version*. A new version is emitted on every status change.
        columns:
          - name: order_id
            data_tests: [not_null]
          - name: order_status
            data_tests:
              - accepted_values:
                  arguments:
                    values: [created, approved, shipped, delivered, cancelled, rto, returned]
          - name: updated_at
            data_tests: [not_null]
      - name: order_items
        columns:
          - name: order_id
            data_tests: [not_null]
      - name: payments
        columns:
          - name: payment_id
            data_tests: [not_null]
      - name: customers
        description: Customer address versions (customers can move state).
        columns:
          - name: customer_id
            data_tests: [not_null]
      - name: products
        description: Full catalogue snapshot (refreshed every load).
        freshness: null
      - name: sellers
        description: Full seller snapshot (refreshed every load).
        freshness: null
